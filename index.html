<!doctype html>
<html lang="ko">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Simple To-Do</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="app">
      <h1>To-Do List</h1>
      <form id="todo-form" class="todo-form">
        <input id="todo-input" type="text" placeholder="할 일을 입력하세요" required maxlength="80" />
        <button type="submit">추가</button>
      </form>

      <ul id="todo-list" class="todo-list" aria-live="polite"></ul>
    </main>

    <template id="todo-item-template">
      <li class="todo-item">
        <label>
          <input type="checkbox" class="toggle" />
          <span class="text"></span>
        </label>
        <button class="delete" type="button" aria-label="삭제">삭제</button>
      </li>
    </template>

    <script src="app.js"></script>
  </body>
</html>
